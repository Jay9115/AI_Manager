<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini Key Manager</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10151c; color: #e9eef5; }
    body { margin: 0; padding: 28px; max-width: 1180px; margin-inline: auto; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: end; margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: 28px; } p { color: #9eacba; margin: 0; }
    button, input { border: 1px solid #344252; border-radius: 6px; padding: 10px 12px; font: inherit; }
    button { cursor: pointer; background: #4c8dff; color: white; border: 0; } button.danger { background: #b6434c; }
    input { background: #171e27; color: inherit; width: 100%; box-sizing: border-box; }
    .toolbar, form { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    form { background: #171e27; padding: 16px; border: 1px solid #293542; border-radius: 8px; margin-bottom: 22px; }
    form input { flex: 1 1 220px; } .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .stat, table { background: #171e27; border: 1px solid #293542; border-radius: 8px; } .stat { padding: 15px; }
    .stat strong { display: block; font-size: 24px; margin-top: 5px; } .stat span { color: #9eacba; font-size: 13px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; } th, td { padding: 12px; text-align: left; border-bottom: 1px solid #293542; } th { color: #9eacba; font-size: 12px; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; } .badge { color: #8ee0ae; } .badge.off, .badge.cooldown, .badge.invalid { color: #ffae8b; }
    .actions { display: flex; gap: 7px; } .actions button { padding: 7px 9px; font-size: 13px; } #message { min-height: 22px; color: #8ee0ae; margin: 10px 0; }
    @media (max-width: 760px) { body { padding: 16px; } header { display: block; } .toolbar { margin-top: 14px; } .stats { grid-template-columns: repeat(2, 1fr); } table { display: block; overflow-x: auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <header><div><h1>Gemini key manager</h1><p>Live health, usage, and server-side key rotation.</p></div><div class="toolbar"><input id="adminToken" type="password" placeholder="Admin token" aria-label="Admin token"><button id="refresh">Refresh</button></div></header>
  <form id="addForm"><input id="label" placeholder="Label (optional)"><input id="key" placeholder="New Gemini API key" required><button>Add key</button></form>
  <div id="message" role="status"></div>
  <section class="stats"><div class="stat"><span>Total keys</span><strong id="total">-</strong></div><div class="stat"><span>Healthy</span><strong id="healthy">-</strong></div><div class="stat"><span>Requests</span><strong id="requests">-</strong></div><div class="stat"><span>Total tokens</span><strong id="tokens">-</strong></div></section>
  <table><thead><tr><th>Key</th><th>Status</th><th>Requests</th><th>Tokens</th><th>Last used</th><th>Actions</th></tr></thead><tbody id="keys"></tbody></table>
<script>
const token = () => document.getElementById('adminToken').value.trim();
const headers = () => ({ 'Content-Type': 'application/json', Authorization: `Bearer ${token()}` });
const message = (text, error = false) => { const el = document.getElementById('message'); el.textContent = text; el.style.color = error ? '#ffae8b' : '#8ee0ae'; };
async function load() {
  try { const response = await fetch('/admin/api/keys', { headers: headers() }); const data = await response.json(); if (!response.ok) throw new Error(data.message); render(data.keys); message(`Updated ${new Date().toLocaleTimeString()}`); }
  catch (error) { message(error.message || 'Could not load keys.', true); }
}
function render(keys) {
  document.getElementById('total').textContent = keys.length; document.getElementById('healthy').textContent = keys.filter(k => k.enabled && k.status === 'healthy').length;
  document.getElementById('requests').textContent = keys.reduce((sum, k) => sum + k.usage.requests, 0).toLocaleString(); document.getElementById('tokens').textContent = keys.reduce((sum, k) => sum + k.usage.totalTokens, 0).toLocaleString();
  document.getElementById('keys').innerHTML = keys.map(key => `<tr><td>${escapeHtml(key.label)}<br><small>${key.maskedKey}</small></td><td><span class="badge ${key.enabled ? key.status : 'off'}">${key.enabled ? key.status : 'disabled'}</span></td><td>${key.usage.requests.toLocaleString()}</td><td>${key.usage.totalTokens.toLocaleString()}</td><td>${key.usage.lastUsedAt ? new Date(key.usage.lastUsedAt).toLocaleString() : 'Never'}</td><td class="actions"><button onclick="editKey('${key.id}', '${encodeURIComponent(key.label)}')">Edit</button><button onclick="toggleKey('${key.id}', ${!key.enabled})">${key.enabled ? 'Disable' : 'Enable'}</button><button class="danger" onclick="removeKey('${key.id}')">Remove</button></td></tr>`).join('');
}
const escapeHtml = value => String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
async function toggleKey(id, enabled) { await updateKey(id, { enabled }); }
async function editKey(id, encodedLabel) { const label = prompt('Label:', decodeURIComponent(encodedLabel)); if (label === null) return; const key = prompt('New Gemini API key (leave blank to keep current):'); try { await updateKey(id, { label, ...(key ? { key } : {}) }); } catch (error) { message(error.message, true); } }
async function updateKey(id, body) { const response = await fetch(`/admin/api/keys/${id}`, { method: 'PATCH', headers: headers(), body: JSON.stringify(body) }); const data = await response.json(); if (!response.ok) throw new Error(data.message); load(); }
async function removeKey(id) { if (!confirm('Remove this API key?')) return; try { const response = await fetch(`/admin/api/keys/${id}`, { method: 'DELETE', headers: headers() }); const data = await response.json(); if (!response.ok) throw new Error(data.message); load(); } catch (error) { message(error.message, true); } }
document.getElementById('addForm').onsubmit = async event => { event.preventDefault(); try { const response = await fetch('/admin/api/keys', { method: 'POST', headers: headers(), body: JSON.stringify({ key: document.getElementById('key').value, label: document.getElementById('label').value }) }); const data = await response.json(); if (!response.ok) throw new Error(data.message); event.target.reset(); load(); } catch (error) { message(error.message, true); } };
document.getElementById('refresh').onclick = load; document.getElementById('adminToken').onchange = load;
</script>
</body>
</html>
